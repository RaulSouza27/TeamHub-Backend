spring.application.name=teamhub-backend

server.port=1200

# logging.level.root=trace

# Configuração de Conexão do BD PostgreSQL (Local)
spring.datasource.url=jdbc:postgresql://localhost:4545/TeamHubDb
spring.datasource.username=adminTeamHub
spring.datasource.password=larissadb
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate (gera a tabela automaticamente se não existir)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Versão da Aplicação
app.version=1.0.0